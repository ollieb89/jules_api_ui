<div class="container mx-auto px-4 py-8 max-w-2xl">
  <div class="mb-6">
    <h1 class="text-3xl font-bold text-gray-900">
      {{ isEditMode() ? 'Edit User' : 'Create User' }}
    </h1>
  </div>

  @if (loading() && isEditMode()) {
    <app-loading-spinner
      label="Loading user data..."
      containerClass="py-12"
    ></app-loading-spinner>
  } @else {
    @if (error()) {
      <div 
        class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded mb-4"
        role="alert"
        aria-live="assertive"
      >
        {{ error() }}
      </div>
    }

    <form [formGroup]="userForm" (ngSubmit)="onSubmit()" class="bg-white shadow-md rounded-lg p-6">
      <div class="mb-4">
        <label for="name" class="block text-sm font-medium text-gray-700 mb-2">
          Name <span class="text-red-500" aria-hidden="true">*</span>
        </label>
        <input
          id="name"
          type="text"
          formControlName="name"
          placeholder="Enter user name"
          [attr.aria-required]="true"
          [attr.aria-invalid]="getFieldError('name') ? 'true' : 'false'"
          [attr.aria-describedby]="getFieldError('name') ? 'name-error' : null"
          class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
          [class.border-red-500]="getFieldError('name')"
          autofocus
        />
        @if (getFieldError('name')) {
          <p id="name-error" class="mt-1 text-sm text-red-600" role="alert">{{ getFieldError('name') }}</p>
        }
      </div>

      <div class="mb-6">
        <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
          Email <span class="text-red-500" aria-hidden="true">*</span>
        </label>
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="Enter user email"
          [attr.aria-required]="true"
          [attr.aria-invalid]="getFieldError('email') ? 'true' : 'false'"
          [attr.aria-describedby]="getFieldError('email') ? 'email-error' : null"
          class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
          [class.border-red-500]="getFieldError('email')"
        />
        @if (getFieldError('email')) {
          <p id="email-error" class="mt-1 text-sm text-red-600" role="alert">{{ getFieldError('email') }}</p>
        }
      </div>

      <div class="flex justify-end space-x-4">
        <a
          routerLink="/users"
          aria-label="Cancel and return to users list"
          class="px-4 py-2 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 inline-block text-center no-underline"
          [class.pointer-events-none]="loading()"
          [class.opacity-50]="loading()"
          [attr.aria-disabled]="loading()"
        >
          Cancel
        </a>
        <button
          type="submit"
          [attr.aria-label]="(isEditMode() ? 'Update' : 'Create') + ' user'"
          class="px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2"
          [disabled]="userForm.invalid || loading()"
          [attr.aria-disabled]="userForm.invalid || loading()"
        >
          @if (loading()) {
            <app-loading-spinner
              sizeClass="h-4 w-4"
              colorClass="text-white"
              containerClass=""
              label="Saving..."
            ></app-loading-spinner>
            <span aria-hidden="true">Saving...</span>
          } @else {
            {{ isEditMode() ? 'Update' : 'Create' }}
          }
        </button>
      </div>
    </form>
  }
</div>
