name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - name: Install dependencies
        run: bun install
      - name: Lint
        run: bun run lint
      - name: Unit tests
        run: bun run test -- --watch=false --browsers=ChromeHeadless
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
      - name: Accessibility tests
        run: bun run test:a11y

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: jules
          POSTGRES_PASSWORD: password
          POSTGRES_DB: jules_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SECRET_KEY: ci-secret-key
      DATABASE_URL: postgres://jules:password@localhost:5432/jules_db
      DEBUG: "False"
      TESTING: "True"
      ALLOWED_HOSTS: "localhost,127.0.0.1"
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.7.0
        with:
          manifest-path: backend/pixi.toml
      - name: Install dependencies
        run: pixi install
      - name: Django deploy checks
        run: pixi run python manage.py check --deploy
      - name: Migration checks
        run: pixi run python manage.py makemigrations --check --dry-run
      - name: Format checks
        run: pixi run format
      - name: Type checks
        run: pixi run typecheck
      - name: Test suite
        run: pixi run test
