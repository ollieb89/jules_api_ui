name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - name: Install dependencies
        run: bun install
        working-directory: frontend
      - name: Lint
        run: bun run lint
        working-directory: frontend
      - name: Unit tests
        run: bun run test -- --watch=false --browsers=ChromeHeadless
        working-directory: frontend
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
        working-directory: frontend
      - name: Accessibility tests
        run: bun run test:a11y
        working-directory: frontend

  backend:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ci-secret-key
      DEBUG: "False"
      TESTING: "True"
      ALLOWED_HOSTS: "localhost,127.0.0.1"
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.7.0
        with:
          manifest-path: backend/pixi.toml
      - name: Install dependencies
        run: pixi install
        working-directory: backend
      - name: Django deploy checks
        run: pixi run python manage.py check --deploy
        working-directory: backend
      - name: Migration checks
        run: pixi run python manage.py makemigrations --check --dry-run
        working-directory: backend
      - name: Format checks
        run: pixi run format
        working-directory: backend
      - name: Type checks
        run: pixi run typecheck
        working-directory: backend
      - name: Test suite
        run: pixi run test
        working-directory: backend
