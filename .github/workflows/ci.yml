name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - name: Install dependencies
        working-directory: frontend
        run: bun install
      - name: Lint
        working-directory: frontend
        run: bun run lint
      - name: Unit tests
        working-directory: frontend
        run: bun run test -- --watch=false --browsers=ChromeHeadless
      - name: Install Playwright browsers
        working-directory: frontend
        run: bunx playwright install --with-deps chromium
      - name: Accessibility tests
        working-directory: frontend
        run: bun run test:a11y

  backend:
    runs-on: ubuntu-22.04
    env:
      DJANGO_SECRET_KEY: ci-secret-key
      DEBUG: "False"
      TESTING: "True"
      ALLOWED_HOSTS: "localhost,127.0.0.1"
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.7.0
        with:
          manifest-path: backend/pixi.toml
      - name: Install dependencies
        working-directory: backend
        run: pixi install
      - name: Django deploy checks
        working-directory: backend
        run: pixi run python manage.py check --deploy
      - name: Migration checks
        working-directory: backend
        run: pixi run python manage.py makemigrations --check --dry-run
      - name: Format checks
        working-directory: backend
        run: pixi run format
      - name: Type checks
        working-directory: backend
        run: pixi run typecheck
      - name: Test suite
        working-directory: backend
        run: pixi run test
